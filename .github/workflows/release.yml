name: Release

# 推送形如 v1.0.0 的 tag 时触发：自动构建并发布可执行 jar 到 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Prepare artifacts
        run: |
          mkdir -p release
          VERSION="${GITHUB_REF_NAME#v}"
          cp baldr-cli/target/baldr.jar "release/baldr-${VERSION}.jar"
          # 便于用户固定文件名下载
          cp baldr-cli/target/baldr.jar "release/baldr.jar"
          ls -lh release

      - name: Generate checksums
        run: |
          cd release
          sha256sum *.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Baldr ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/baldr-*.jar
            release/baldr.jar
            release/SHA256SUMS.txt